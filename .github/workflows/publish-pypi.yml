# Publish the kafka-native Python wheel (bundled
# libkafka_native) via PyPI Trusted Publishing (OIDC).
# Manual dispatch only. Requires a Trusted Publisher
# configured for the project on PyPI (this repo + this
# workflow file).
name: publish-pypi
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
            slug: linux-x86_64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            slug: linux-aarch64
          - runner: macos-latest
            slug: mac-arm64-py312
            python: '3.12'
            macarch: arm64
          - runner: macos-latest
            slug: mac-arm64-py313
            python: '3.13'
            macarch: arm64
          - runner: macos-latest
            slug: mac-x86_64-py312
            python: '3.12'
            macarch: x86_64
          - runner: macos-latest
            slug: mac-x86_64-py313
            python: '3.13'
            macarch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels in manylinux_2_28 (cp312 + cp313)
        if: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/io" -w /io "${{ matrix.image }}" bash -c '
            set -e
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null
            export PATH="$HOME/.cargo/bin:$PATH"
            (cd crates/kafka-native && cargo build --release)
            mkdir -p wheel/grpcdc wheel/dist
            cp python/grpcdc/*.py wheel/grpcdc/
            cp crates/kafka-native/target/release/libkafka_native.so wheel/grpcdc/
            cp python/pyproject-kafka-native.toml wheel/pyproject.toml
            cp python/setup-kafka-native.py wheel/setup.py
            cp README.md wheel/README.md
            for PY in cp312-cp312 cp313-cp313; do
              /opt/python/$PY/bin/python -m pip install -q build wheel
              (cd wheel && /opt/python/$PY/bin/python -m build --wheel --outdir dist-$PY)
              /opt/python/$PY/bin/python -m wheel tags --platform-tag manylinux_2_28_$(uname -m) --remove wheel/dist-$PY/*.whl
              cp wheel/dist-$PY/*.whl wheel/dist/
            done
          '
      - name: Set up Rust (macOS)
        if: ${{ !matrix.image }}
        uses: dtolnay/rust-toolchain@stable
      - name: Add x86_64 target (macOS cross)
        if: ${{ matrix.macarch == 'x86_64' }}
        run: rustup target add x86_64-apple-darwin
      - name: Set up Python (macOS)
        if: ${{ !matrix.image }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel (macOS)
        if: ${{ !matrix.image }}
        run: |
          if [ "${{ matrix.macarch }}" = "x86_64" ]; then
            (cd crates/kafka-native && cargo build --release --target x86_64-apple-darwin)
            LIB=crates/kafka-native/target/x86_64-apple-darwin/release/libkafka_native.dylib
            TAG=macosx_10_12_x86_64
          else
            (cd crates/kafka-native && cargo build --release)
            LIB=crates/kafka-native/target/release/libkafka_native.dylib
            TAG=macosx_11_0_arm64
          fi
          if [ -f "$LIB" ]; then echo "built $LIB"; else echo "LIB MISSING: $LIB"; find crates/kafka-native/target -name 'libkafka_native*' 2>/dev/null | head -3; fi
          mkdir -p wheel/grpcdc wheel/dist
          cp python/grpcdc/*.py wheel/grpcdc/
          cp "$LIB" wheel/grpcdc/libkafka_native.dylib
          cp python/pyproject-kafka-native.toml wheel/pyproject.toml
          cp python/setup-kafka-native.py wheel/setup.py
          cp README.md wheel/README.md
          pip install build wheel
          (cd wheel && python -m build --wheel)
          python -m wheel tags --platform-tag "$TAG" --remove wheel/dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: wheel/dist/*.whl
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble sdist tree (crate sources, no prebuilt lib)
        run: |
          mkdir -p wheel/grpcdc wheel/crates
          cp python/grpcdc/*.py wheel/grpcdc/
          cp python/pyproject-kafka-native.toml wheel/pyproject.toml
          cp python/setup-kafka-native.py wheel/setup.py
          cp python/MANIFEST-kafka-native.in wheel/MANIFEST.in
          cp README.md wheel/README.md
          cp -r crates/kafka-native wheel/crates/kafka-native
          rm -rf wheel/crates/kafka-native/target
          cp -r rust wheel/rust
          rm -rf wheel/rust/target
          cp -r webrtc wheel/webrtc
          rm -rf wheel/webrtc/*/target
          cp crates/kafka-native/Cargo.lock wheel/Cargo.lock
      - name: Build sdist
        working-directory: wheel
        run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: wheel/dist/*.tar.gz
  publish:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheel/dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheel/dist
          skip-existing: true
