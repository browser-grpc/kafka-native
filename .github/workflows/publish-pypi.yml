# Publish the kafka-native Python wheel (bundled
# libkafka_native) via PyPI Trusted Publishing (OIDC).
# Manual dispatch only. Requires a Trusted Publisher
# configured for the project on PyPI (this repo + this
# workflow file).
name: publish-pypi
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
            slug: wheels-x86_64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            slug: wheels-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels in manylinux_2_28 (cp312 + cp313)
        run: |
          docker run --rm -v "$PWD:/io" -w /io "${{ matrix.image }}" bash -c '
            set -e
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null
            export PATH="$HOME/.cargo/bin:$PATH"
            (cd crates/kafka-native && cargo build --release)
            mkdir -p wheel/grpcdc wheel/dist
            cp python/grpcdc/*.py wheel/grpcdc/
            cp crates/kafka-native/target/release/libkafka_native.so wheel/grpcdc/
            cp python/pyproject-kafka-native.toml wheel/pyproject.toml
            cp python/setup-kafka-native.py wheel/setup.py
            cp README.md wheel/README.md
            for PY in cp312-cp312 cp313-cp313; do
              /opt/python/$PY/bin/python -m pip install -q build wheel
              (cd wheel && /opt/python/$PY/bin/python -m build --wheel --outdir dist-$PY)
              /opt/python/$PY/bin/python -m wheel tags --platform-tag manylinux_2_28_$(uname -m) --remove wheel/dist-$PY/*.whl
              cp wheel/dist-$PY/*.whl wheel/dist/
            done
          '
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: wheel/dist/*.whl
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheel/dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheel/dist
